name: ProjectTown
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 1.4.0
    CURRENT_PROJECT_VERSION: 10
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  ProjectTownCore:
    path: Packages/ProjectTownCore
targets:
  ProjectTown:
    type: application
    platform: macOS
    sources:
      - app/Sources/ProjectTown
      - app/Resources/Localizable.xcstrings
      - path: app/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kevinyu1580.ProjectTown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: app/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDisplayName: ProjectTown
        CFBundleLocalizations: [en, zh-Hant]
        LSMinimumSystemVersion: "14.0"
    postCompileScripts:
      - name: Copy web/dist into Resources/web
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/web/dist/index.html
        script: |
          if [ ! -f "$SRCROOT/web/dist/index.html" ]; then
            echo "error: web/dist missing, run 'cd web && npm run build' first"
            exit 1
          fi
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          rsync -a --delete "$SRCROOT/web/dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
    dependencies:
      - package: ProjectTownCore
    scheme: {}
